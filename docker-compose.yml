services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: amm-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - documents_data:/var/www/html/storage/app/private
    environment:
      APP_ENV: ${APP_ENV:-local}
    networks:
      - amm
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: amm-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - amm
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: amm-mysql
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-amm}
      MYSQL_USER: ${DB_USERNAME:-amm}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-storage-engine=InnoDB
      - --innodb-file-per-table=1
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - amm

  redis:
    image: redis:7.4-alpine
    container_name: amm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - amm

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: amm-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=120 --max-time=3600
    volumes:
      - .:/var/www/html
      - documents_data:/var/www/html/storage/app/private
    networks:
      - amm
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: amm-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - .:/var/www/html
    networks:
      - amm
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  vite:
    image: node:22-alpine
    container_name: amm-vite
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
    networks:
      - amm

networks:
  amm:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  documents_data:
